# Arquivo de configuracao da Automacao Gerencie Carteira
# Defaults universais via %USERPROFILE% — a aplicacao expande em runtime.
# Pasta publica (A:\PUBLICA\...) e uma rota de rede pre-existente e NAO e criada pelo app.

[Paths]
# Pasta onde anexos HTML dos emails serao salvos
pasta_destino_html = %USERPROFILE%\Documents\Gerencie_Carteira\html

# Pasta onde as planilhas diarias do Excel (.xlsm) serao salvas
pasta_diario_excel = %USERPROFILE%\Documents\Gerencie_Carteira\planilhas

# Pasta onde a copia publica em rede da planilha (.xlsm) sera salva — NAO criada pelo app
pasta_copia_excel = A:\PUBLICA\GERENCIE CARTEIRA PUBLICA

# Executavel aberto em caso de erro de gerente (pendencias)
executavel_direciona = C:\DIRECIONA\atualiza.exe

# Pasta onde os arquivos de log serao salvos
pasta_logs = %USERPROFILE%\Documents\Gerencie_Carteira\logs

[Excel]
# Aba com a base de dados
planilha_dados = E-Mail BD

# Coluna de verificacao do erro #N/D
coluna_verificacao = E

[Email]
# Assunto exato do email que o script deve procurar
assunto_procurado = Gerencie Carteira - Consulte as Empresas Monitoradas
