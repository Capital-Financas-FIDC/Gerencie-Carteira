# Arquivo de configuracao da Automacao Gerencie Carteira
# As pastas de trabalho ficam na rede, sob ...\GERENCIE CARTEIRA PÚBLICA\Software\data.
# A pasta publica (pasta_copia_excel) e rota de rede pre-existente e NAO e criada pelo app.

[Paths]
# Pasta onde anexos HTML dos emails serao salvos
pasta_destino_html = A:\PUBLICA\GERENCIE CARTEIRA PÚBLICA\Software\data\html

# Pasta onde as planilhas diarias do Excel (.xlsm) serao salvas
pasta_diario_excel = A:\PUBLICA\GERENCIE CARTEIRA PÚBLICA\Software\data\planilhas

# Pasta onde a copia publica em rede da planilha (.xlsm) sera salva — NAO criada pelo app
pasta_copia_excel = A:\PUBLICA\GERENCIE CARTEIRA PÚBLICA

# Pasta onde os arquivos de log serao salvos
pasta_logs = A:\PUBLICA\GERENCIE CARTEIRA PÚBLICA\Software\data\logs

[Excel]
# Aba com a base de dados
planilha_dados = E-Mail BD

# Coluna de verificacao do erro #N/D
coluna_verificacao = E

# Aba de cadastro CNPJ -> Gerente (PROCX/VLOOKUP)
sheet_procx = PROCX GERENTES

# Coluna do nome do gerente na aba PROCX
col_procx_gerente = B

# Coluna do CNPJ na aba PROCX
col_procx_cnpj = C

# Nome da Tabela formatada (ListObject) da aba PROCX. Opcional: se vazio/ausente,
# usa a primeira Tabela da aba. A nova linha e inserida via API da Tabela para
# que ela se expanda e a referencia estruturada do PROCX cubra a linha.
tabela_procx =

[Email]
# Assunto exato do email que o script deve procurar
assunto_procurado = Gerencie Carteira - Consulte as Empresas Monitoradas

[Retencao]
# Numero maximo de arquivos mantidos nas pastas de planilhas e de HTML.
# Apos cada salvamento, os mais antigos sao removidos ate sobrarem este
# numero. 30 cobre cerca de 1 mes de historico. Secao opcional: se ausente,
# o padrao e 30.
max_arquivos = 30
